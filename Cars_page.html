  <script>
    const menuToggle = document.getElementById("menu-toggle");
    const mobileMenu = document.getElementById("mobile-menu");

    menuToggle.addEventListener("click", () => {
      if (mobileMenu.classList.contains("block")) {
        mobileMenu.classList.remove("opacity-100");
        mobileMenu.classList.remove("starting:opacity-0");
        mobileMenu.classList.remove("scale-100");
        mobileMenu.classList.remove("starting:scale-0");
        mobileMenu.classList.add("starting:opacity-100");
        mobileMenu.classList.add("opacity-0");
        mobileMenu.classList.add("starting:scale-100");
        mobileMenu.classList.add("scale-0");
        setTimeout(transitionMobileMenu, 300);
      } else {
        mobileMenu.classList.remove("starting:opacity-100");
        mobileMenu.classList.remove("opacity-0");
        mobileMenu.classList.remove("starting:scale-100");
        mobileMenu.classList.remove("scale-0");
        mobileMenu.classList.add("opacity-100");
        mobileMenu.classList.add("starting:opacity-0");
        mobileMenu.classList.add("scale-100");
        mobileMenu.classList.add("starting:scale-0");
        transitionMobileMenu();
      }
    });

    function transitionMobileMenu() {
      if (mobileMenu.classList.contains("block")) {
        mobileMenu.classList.remove("block");
        mobileMenu.classList.add("hidden");
      } else {
        mobileMenu.classList.remove("hidden");
        mobileMenu.classList.add("block");
      }
    }
  </script>
